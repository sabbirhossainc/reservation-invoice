    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Car Reservation",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "description": "Create a car rental reservation, calculate charges and discounts, and print a clean A4 invoice.",
        "url": "https://invoiceappui.netlify.app/",
        "image": "https://invoiceappui.netlify.app/og-image.png"
      }
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('car-reservation-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#0e1621' : '#f5f7fa');
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.theme = 'light';
          var fallbackMeta = document.querySelector('meta[name="theme-color"]');
          if (fallbackMeta) fallbackMeta.setAttribute('content', '#f5f7fa');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
